# BlackWikiSMP 2.4 음성 채팅 설정 예시 / 공식 Simple Voice Chat 2.6.25
# 음성은 게임 접속 TCP 포트와 별도로 UDP 포트 개방이 필요합니다.
port=24454
# 빈 값: server.properties의 server-ip 사용. 전체 인터페이스는 *.
bind_address=
# 일반 음성/속삭임이 들리는 거리(블록)
max_voice_distance=48.0
whisper_distance=24.0
codec=VOIP
mtu_size=1275
tcp_rate_limit=16
keep_alive=1000
# 팀 음성 그룹 기능을 쓰려면 true 유지
enable_groups=true
# 일반적으로 빈 값 유지. 별도 프록시/호스팅 주소가 필요한 경우 공식 문서 확인.
voice_host=
allow_recording=true
spectator_interaction=false
spectator_player_possession=false
# 음성 모드가 없는 플레이어도 게임 접속 허용
force_voice_chat=false
login_timeout=10000
broadcast_range=-1.0
allow_pings=true
threaded_server_support=true
