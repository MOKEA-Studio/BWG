# Push a tag like v3.4 -> builds the plugin and publishes a GitHub release with the JAR.
# Servers running BlackWikiSMP with auto-update.repository set download it automatically.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check tag matches pom.xml and plugin.yml
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "<artifactId>BlackWikiSMP</artifactId><version>$v</version>" pom.xml || { echo "pom.xml version is not $v"; exit 1; }
          grep -q "^version: '$v'" src/main/resources/plugin.yml || { echo "plugin.yml version is not $v"; exit 1; }
      - run: mvn -B package
      - run: gh release create "$GITHUB_REF_NAME" "target/BlackWikiSMP-${GITHUB_REF_NAME#v}.jar" --title "BlackWikiSMP ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
